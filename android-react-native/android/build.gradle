buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "28.1.13356709"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.10.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
         classpath 'com.google.gms:google-services:4.4.2'
    }
}

apply plugin: "com.facebook.react.rootproject"

// ⬇️ Add this block to force correct dependencies and exclude com.android.support
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://artifactory.applovin.com/artifactory/android' }
        maven { url "https://maven.facebook.com/" }
        maven { url "https://artifactory.appodeal.com/appodeal" }
        maven { url 'https://artifact.bytedance.com/repository/pangle' }
        //  google()
        // jcenter()
        // mavenLocal()
        // mavenCentral()
        // // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        // maven { url("$rootDir/../node_modules/react-native/android") }
        // // Android JSC is installed from npm
        // maven { url("$rootDir/../node_modules/jsc-android/dist") }
        // maven { url 'https://www.jitpack.io' }
        // maven { url "https://artifactory.appodeal.com/appodeal-beta-public" }
        
    }

   configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        // Exclude legacy Android support libraries causing duplicate class issues
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support'
    }
}

// Keep React Native native-build paths short enough for Windows CMake/Ninja.
subprojects { nativeModule ->
    if (nativeModule.name in ['react-native-screens', 'react-native-reanimated']) {
        nativeModule.plugins.withId('com.android.library') {
            nativeModule.android.externalNativeBuild.cmake.buildStagingDirectory =
                    new File(rootProject.gradle.gradleUserHomeDir, "blockrium-native/${nativeModule.name}")
        }
    }
}

}

