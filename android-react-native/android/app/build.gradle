apply plugin: "com.android.application"
apply plugin: 'com.google.gms.google-services' 
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    extraPackagerArgs = ["--max-workers", "2"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true
def enableResourceShrinkingInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'
def umpDebugEea = (project.findProperty("UMP_DEBUG_EEA") ?: "false").toString().toBoolean()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.blockrium"
    defaultConfig {
        applicationId "com.blockrium"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 93
        versionName "1.10.63"
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def localReleaseProps = new Properties()
            def localReleasePropsFile = rootProject.file('release-upload-key-20260713-003451.properties')
            if (localReleasePropsFile.exists()) {
                localReleasePropsFile.withInputStream { localReleaseProps.load(it) }
            }
            def releaseProp = { name ->
                def value = project.findProperty(name) ?: localReleaseProps.getProperty(name)
                return value?.toString()?.trim()
            }
            def releaseStoreFileName = releaseProp('MYAPP_UPLOAD_STORE_FILE')
            if (releaseStoreFileName) {
                def releaseStoreFile = file(releaseStoreFileName)
                if (!releaseStoreFile.exists()) {
                    releaseStoreFile = rootProject.file("../${releaseStoreFileName}")
                }
                if (!releaseStoreFile.exists()) {
                    releaseStoreFile = rootProject.file(releaseStoreFileName)
                }
                if (releaseStoreFile.exists()) {
                    storeFile releaseStoreFile
                    storePassword releaseProp('MYAPP_UPLOAD_STORE_PASSWORD')
                    keyAlias releaseProp('MYAPP_UPLOAD_KEY_ALIAS')
                    keyPassword releaseProp('MYAPP_UPLOAD_KEY_PASSWORD')
                }
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Development only: run `gradlew installDebug -PUMP_DEBUG_EEA=true`
            // on an emulator to force the UMP EEA consent flow. Release builds
            // always compile this flag as false.
            buildConfigField "boolean", "UMP_DEBUG_EEA", umpDebugEea.toString()
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "boolean", "UMP_DEBUG_EEA", "false"
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableResourceShrinkingInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

def nativeBaseFontsDir = file("../../node_modules/native-base/Fonts")
def nativeBaseFontsOutput = file("$buildDir/intermediates/NativeBaseFonts")
def copyNativeBaseFontsTask = tasks.register("copyNativeBaseFonts", Copy) {
    from(nativeBaseFontsDir) {
        include "Roboto_medium.ttf"
    }
    into file("$nativeBaseFontsOutput/fonts")
}
android.sourceSets.main.assets.srcDir(nativeBaseFontsOutput)

// AGP's release lint model also reads the generated NativeBase font assets.
// Declare the producer dependency explicitly so Gradle schedules the copy first.
tasks.matching {
    it.name == "generateReleaseLintVitalReportModel" || it.name == "lintVitalAnalyzeRelease"
}.configureEach {
    dependsOn(copyNativeBaseFontsTask)
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def generateAssetsTask = tasks.findByName("generate${variant.name.capitalize()}Assets")
        if (generateAssetsTask) {
            generateAssetsTask.dependsOn(copyNativeBaseFontsTask)
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseBuild = taskGraph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (isReleaseBuild && !android.signingConfigs.release.storeFile) {
        throw new GradleException("Release signing is not configured. Set MYAPP_UPLOAD_* values outside source control.")
    }
    if (isReleaseBuild && android.signingConfigs.release.storeFile?.name == "debug.keystore" && !project.hasProperty("ALLOW_DEBUG_RELEASE_SIGNING")) {
        throw new GradleException("Refusing to sign a release with debug.keystore. Add -PALLOW_DEBUG_RELEASE_SIGNING=true only for local QA artifacts, never for Play upload.")
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'com.google.firebase:firebase-messaging:23.3.1'
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    // Keep the direct SDK aligned with the Appodeal AdMob adapter below.
    implementation "com.google.android.gms:play-services-ads:24.7.0"
    // Appodeal 4.x uses individual Android adapters. These match the AdMob
    // bidding partners configured for Blockrium in Appodeal/AdMob dashboards.
    // AdMob 25.2 is compiled with Kotlin 2.2 metadata and is not compatible
    // with React Native 0.77's Kotlin 2.0 toolchain yet.
    implementation "com.appodeal.ads.sdk.adapters:admob:24.7.0.0"
    implementation "com.appodeal.ads.sdk.adapters:bidon:0.14.0.0"
    implementation "com.appodeal.ads.sdk.adapters:level_play:9.4.3.0"
    implementation "com.appodeal.ads.sdk.adapters:applovin_max:13.6.3.0"
    // Keep Play Billing on the current supported line. See GooglePlayBillingModule.kt
    // for the Billing Library 8+ product-query response shape.
    implementation "com.android.billingclient:billing:9.1.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
